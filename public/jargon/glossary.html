<html lang="zh-CN">
<head>

</head>
<body><main class="jargon-shell glossary-shell">
  <header class="project-heading"><div><h1>全部术语，随手查。</h1><p>先查明白，再回到场景里练习。</p></div><span class="pill">431 条术语记录</span></header>
  <nav class="glossary-modes" aria-label="黑话学习方式"><a href="/jargon/glossary.html" aria-current="page">全部术语 · 431</a><a href="/jargon/canvas.html">知识小画布</a><a href="/jargon/">场景练习 · 16 →</a></nav>
  <form id="lookup-form" class="lookup-controls" role="search">
    <div class="lookup-query"><label for="lookup-search">搜索术语或释义</label><input id="lookup-search" type="search" placeholder="例如：赋能、LoRA、留存" autocomplete="off"></div>
    <div><label for="lookup-collection">词表</label><select id="lookup-collection"><option value="">全部词表 · 431</option><option value="产品经理">产品经理 · 288</option><option value="AI">AI · 142</option></select></div>
    <div><label for="lookup-topic">主题</label><select id="lookup-topic"><option value="">全部主题</option></select></div>

  </form>
  <p class="quiet lookup-note">产品经理 288 条 · AI 142 条。按原词表逐条收录，同名词保留不同语境；“潜台词”等调侃表达仅帮助理解语境。</p>
  <p id="lookup-status" role="status" aria-live="polite">正在加载完整词表…</p>
  <button id="lookup-retry" class="secondary" type="button" hidden>重新加载词表</button>
  <section id="lookup-results" class="lookup-results" aria-label="术语释义"></section>
  <section id="lookup-empty" class="card" hidden><h2>没有找到匹配的术语</h2><p>试试更短的关键词，或重置词表和主题筛选。</p></section>
  <nav id="lookup-pages" class="lookup-pages" aria-label="词表分页" hidden><button id="lookup-prev" class="secondary" type="button">← 上一页</button><span id="lookup-page"></span><button id="lookup-next" class="secondary" type="button">下一页 →</button></nav>
